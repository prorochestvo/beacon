# CI for the long-lived branches — lints, runs the full suite, and does a
# production-shape build on every push to main or alpha and every PR targeting
# either. alpha is where day-to-day work integrates and where release tags are
# cut; main only ever moves to the latest non-prerelease tag. No deploy — the
# release pipeline lives in release.yml and triggers on r* tags.
name: ci-main
on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha]

permissions:
  contents: read

concurrency:
  # PRs supersede their own previous runs; main pushes queue rather than cancel
  # so a follow-up push does not abort in-flight CI for the previous commit.
  group: ci-main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build stamps a version out of git, and lint-new — still
          # in the Makefile for local use — resolves LINT_BASE through it. A shallow
          # clone fails on a ref that does not resolve rather than on code, which is
          # the least useful red a gate can produce.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pinned to the same version the Makefile names, so a local run and CI
      # cannot disagree about what a finding is.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      # Tee each fail-prone step into a shared trace. Nothing reads it in this
      # workflow — see the note at the end of the job — but release.yml's gate
      # steps are written the same way, and keeping them identical costs nothing.
      #
      # lint, not lint-new: the standing backlog is gone, so the full run is a
      # gate rather than a worklist and a regression anywhere is caught, not only
      # one on a line the author happened to touch. lint-new stays in the Makefile
      # for fast local feedback on a branch.
      - name: Lint
        run: |
          exec > >(tee -a "$RUNNER_TEMP/deploy_trace.log") 2>&1
          make lint
      - name: Test
        run: |
          exec > >(tee -a "$RUNNER_TEMP/deploy_trace.log") 2>&1
          make test
      # production-shape build: CGO off, linux/amd64, the same artifacts
      # release.yml ships. Catches "tests pass but prod build breaks" (build
      # tags, race-only files, missing wasm assets).
      - name: Sanity build
        env:
          CGO_ENABLED: "0"
        run: |
          exec > >(tee -a "$RUNNER_TEMP/deploy_trace.log") 2>&1
          mkdir -p ./cmd/web/static
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ./cmd/web/static/wasm_exec.js
          GOOS=js GOARCH=wasm go build -o ./cmd/web/static/app.wasm ./cmd/wasm
          GOOS=linux GOARCH=amd64 go build -o ./build/webapp ./cmd/web
          GOOS=linux GOARCH=amd64 go build -o ./build/collector ./cmd/collector
          GOOS=linux GOARCH=amd64 go build -o ./build/notifier ./cmd/notifier
          GOOS=linux GOARCH=amd64 go build -o ./build/migrator ./cmd/migrator

      # No failure notification, deliberately. One lived here and was removed: the
      # Telegram credentials are configured on the PRIME environment, and a job that
      # does not declare `environment:` cannot read them — GitHub substitutes empty
      # strings. The step's own `[ -n "$TOKEN" ] || exit 0` guard then exited 0 on
      # every run, so it reported success while sending nothing, and a reader
      # scanning the job would conclude a red run reaches the shared chat.
      #
      # It never worked: it was added on 2026-07-14, after the credentials had
      # already been scoped to PRIME. `if: failure()` also meant it never ran —
      # this workflow has no failures in its last 60 runs.
      #
      # Declaring `environment: PRIME` here is not the fix. This job runs `make
      # test`, i.e. arbitrary project and dependency code, and PRIME holds
      # SSH_PRIVATEKEY for the production host. PRIME's `tag: r*` branch policy
      # would block it on a branch or PR run anyway.
      #
      # A red run is not silent regardless: GitHub emails the actor, and a failing
      # check is visible on the PR. See #118 for the same decision on release.yml.
